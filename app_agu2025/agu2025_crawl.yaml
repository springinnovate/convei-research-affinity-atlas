agu2025_crawl:
  app_title: <a href="https://agu.confex.com/agu/agu25/meetingapp.cgi/Home/0">AGU 2025</a> CONVEI Research Affinity Atlas

  # Where to start crawling
  start_urls:
    - https://agu.confex.com/agu/agu25/meetingapp.cgi/Day/2025-12-15
    - https://agu.confex.com/agu/agu25/meetingapp.cgi/Day/2025-12-16
    - https://agu.confex.com/agu/agu25/meetingapp.cgi/Day/2025-12-17
    - https://agu.confex.com/agu/agu25/meetingapp.cgi/Day/2025-12-18
    - https://agu.confex.com/agu/agu25/meetingapp.cgi/Day/2025-12-19

  allowed_scopes:
    - https://agu.confex.com/agu/agu25/meetingapp.cgi

  # These are CSS selectors that restrict parsing to these sections of the page.
  content_sections:
    - .Content.Session
    - .Content.Person
    - .itemCalendar
    - .flexItemCalendar
    - .personListItem

  drop_elements:
    - path
    - script
    - svg
    - form
    - textarea
    - input

  # These are user defined abstract concepts that will be expected in this
  # page, an LLM will use this info to process later
  entities:
    - type: Person
      description: >
        A person involved in the event, such as speakers, organizers, or key
        contacts. Focus on people who might be relevant for networking:
        capture their research areas, disciplines, methods, domains of
        expertise, and any signals about their interests or communities
        they are part of.

    - type: Session
      description: >
        A talk, panel, workshop, or other scheduled activity. Capture its
        title, main themes, problems it addresses, disciplines involved,
        and any mentioned speakers or organizers. Include enough detail
        that someone could decide whether this session aligns with their
        interests or suggests people they should meet.

  # can put an integer here to get a fixed number of additional pages
  max_pages: 'no_limit'

  num_workers: 32
  requests_per_second: 10.0
  max_fetch_retries: 5
  sqlite_path: './data/agu2025_crawl.sqlite'
