<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>CONVEI Research Affinity Atlas</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}">


    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-primary navbar-dark mb-4">
            <div class="container">
                <a class="navar-brand" href="#">Internal IPBES Selection - CONVEI Research Affinity Atlas</a>
            </div>
        </nav>

        <div class="container">
            <h4 class="mb-3">Internal IPBES Selection - CONVEI Research Affinity Atlas</h4>

            <h4 class="mt-5 mb-3">Find Interesting People</h4>
              <div id="MatchPeopleContainer">
                <textarea id="UserInterestText"
                          class="form-control mb-2"
                          rows="3"
                          placeholder="Describe the role, responsibilities, and qualifications you have in mind including topics, skills, communities, and approaches and we'll identify candidates in the dataset whose documented expertise and experience best fits"></textarea>

                <button id="MatchPeopleBtn" class="btn btn-primary">
                  <span id="MatchPeopleBtnText">Find Matches</span>
                  <span id="MatchPeopleBtnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>

                <div id="MatchResults" class="mt-3"></div>
              </div>

            <h4 class="mt-5 mb-3">Search For People</h4>
            <div id="EntitiesSelectContainer">
                <!-- The value select element will be inserted here -->
            </div>

        </div>

        <script>
            const getEl = id => document.getElementById(id);
            const fetchJSON = (u,o) => fetch(u,o).then(r => r.json());

            function createOrGetRow(id){
              let row = getEl('crawl-row-'+id);
              if(!row){
                row = document.createElement('div');
                row.id = 'crawl-row-'+id;
                row.className = 'alert alert-info py-1 mb-2';
                getEl('crawl-status-list').appendChild(row);
              }
              return row;
            }

            const updateRow = (row,msg,done=false)=>
              (row.textContent = msg,
               row.className = `alert ${done?'alert-success':'alert-info'} py-1 mb-2`);

            async function loadEntities() {
              const c = getEl('EntitiesSelectContainer');
              if (!getEl('EntitiesSelect')) {
                c.innerHTML = `
                  <select id="EntitiesSelect" multiple style="width:100%"></select>
                  <div id="bioContainer" class="mt-4"></div>
                `;
                const s = $('#EntitiesSelect').select2({
                  placeholder: 'Search and select Entities',
                  allowClear: true,
                  width: '100%'
                });

                let prev = new Set();

                s.on('change', async () => {
                  const cur = new Set(s.val() || []);

                  // remove cards for items that were deselected
                  prev.forEach(id => {
                    if (!cur.has(id)) {
                      const el = getEl(`bio-${id}`);
                      if (el) el.remove();
                    }
                  });

                  // add cards for newly-selected items
                  const toAdd = [...cur].filter(id => !prev.has(id));
                  await Promise.all(
                    toAdd.map(async id => {
                      const container = getEl('bioContainer');

                      // placeholder card
                      const card = document.createElement('div');
                      card.id = `bio-${id}`;
                      card.className = 'alert alert-primary p-3 mb-3';
                      card.innerHTML = `
                        <div class="placeholder-glow">
                          <span class="placeholder col-6"></span>
                          <span class="placeholder col-12 mt-2"></span>
                          <span class="placeholder col-8 mt-2"></span>
                        </div>
                      `;
                      container.appendChild(card);

                      try {
                        const { name, bio, url_list } = await fetchJSON('/person/bio', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ person_name: id })
                        });

                        // rebuild pretty card
                        card.innerHTML = '';
                        const title = document.createElement('h5');
                        title.className = 'fw-bold mb-2';
                        title.textContent = name;

                        const bioEl = document.createElement('div');
                        bioEl.className = 'mb-2';

                        // preserve line breaks into paragraphs
                        const parts = String(bio || '').split(/\n{2,}|\r?\n/).filter(Boolean);
                        if (parts.length === 0) {
                          const p = document.createElement('p');
                          p.className = 'mb-2';
                          p.textContent = 'Bio not available.';
                          bioEl.appendChild(p);
                        } else {
                          parts.forEach(txt => {
                            const p = document.createElement('p');
                            p.className = 'mb-2';
                            p.textContent = txt.trim();
                            bioEl.appendChild(p);
                          });
                        }

                        card.appendChild(title);
                        card.appendChild(bioEl);

                        if (Array.isArray(url_list) && url_list.length) {
                          const listWrap = document.createElement('div');
                          listWrap.className = 'mt-2';

                          const ul = document.createElement('ul');
                          ul.className = 'small mb-0 ps-3';
                          url_list.forEach(sub_url_list => {
                            sub_url_list.forEach(u => {
                              if (!u) return;
                              const li = document.createElement('li');
                              const a = document.createElement('a');
                              a.href = u['_url'];
                              a.target = '_blank';
                              a.rel = 'noopener noreferrer';
                              a.textContent = u['_url'];
                              li.appendChild(a);
                              ul.appendChild(li);
                            });
                          });

                          listWrap.appendChild(ul);
                          card.appendChild(listWrap);
                        }
                      } catch (e) {
                        console.error('Error fetching bio:', e);
                        card.className = 'alert alert-danger p-3 mb-3';
                        card.textContent = `Failed to load bio for ${id}`;
                      }
                    })
                  );

                  prev = cur;
                });
              }

              try {
                const { entities } = await fetchJSON('/entities/');
                const sel = getEl('EntitiesSelect');
                const existing = new Set([...sel.options].map(o => o.value));
                entities.filter(e => !existing.has(e)).forEach(e => sel.add(new Option(e, e)));
                $(sel).trigger('change.select2');
              } catch (e) {
                console.error('Failed to load entities:', e);
                const ctn = getEl('EntitiesSelectContainer');
                ctn.innerHTML = `
                  <div class="alert alert-danger" role="alert">
                    Failed to load entities.
                  </div>`;
              }
            }

            // Optional: reuse this if you need a direct helper elsewhere
            async function fetchBio(name) {
              try {
                const res = await fetchJSON('/person/bio', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({ person_name: name })
                });
                return res.bio;
              } catch (e) {
                console.error(`Error fetching bio for ${name}:`, e);
                return 'Bio not available.';
              }
            }

            async function showMatches(matches) {
              const out = getEl('MatchResults');

              if (!matches.length) {
                out.textContent = 'No relevant people found.';
                return;
              }

              out.innerHTML = '';

              for (const m of matches) {
                const bio = await fetchBio(m.name);

                const urlList = m.urls ? `
                  <ul>${m.urls.map(url => `<li><a href="${url}" target="_blank">${url}</a></li>`).join('')}</ul>
                ` : '';

                const matchEl = document.createElement('div');
                matchEl.className = 'alert alert-info py-1 mb-2';

                matchEl.innerHTML = `
                  <strong>${m.name}</strong> — score ${m.relevance_score}<br>
                  <em>${m.rationale}</em><br>
                  <small>${m.bio_quote}</small>
                  <div class="mt-2"><strong>Bio:</strong> ${bio}</div>
                  ${urlList}
                `;

                out.appendChild(matchEl);
              }
            }

            let matchProgressTimer = null;

            getEl('MatchPeopleBtn').addEventListener('click', async () => {
              const btn  = getEl('MatchPeopleBtn'),
                    txt  = getEl('MatchPeopleBtnText'),
                    spin = getEl('MatchPeopleBtnSpinner'),
                    box  = getEl('UserInterestText'),
                    input = (box.value || '').trim();

              if (!input) return;

              // Disable UI while running
              btn.disabled = true;
              box.disabled = true; // disable text input
              txt.textContent = 'Starting...';
              spin.classList.remove('d-none');

              try {
                // 1) start job
                const { job_id } = await fetchJSON('/people/search/start', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ query: input })
                });

                // 2) poll progress
                await new Promise((resolve, reject) => {
                  matchProgressTimer = setInterval(async () => {
                    try {
                      const { total_batches, submitted, completed, status } = await fetchJSON(`/people/search/progress/${encodeURIComponent(job_id)}`);
                      if (total_batches > 0) {
                        txt.textContent = `Matching... (${completed} of ${total_batches} chunks done) -- Do not navigate away from the page`;
                      } else {
                        txt.textContent = 'Matching...';
                      }
                      if (status === 'error') {
                        clearInterval(matchProgressTimer);
                        matchProgressTimer = null;
                        reject(new Error(message || 'Search failed'));
                      }
                      if (status === 'done') {
                        clearInterval(matchProgressTimer);
                        matchProgressTimer = null;
                        resolve();
                      }
                    } catch (e) {
                      clearInterval(matchProgressTimer);
                      matchProgressTimer = null;
                      reject(e);
                    }
                  }, 1000);
                });

                // 3) fetch result
                const result = await fetchJSON(`/people/search/result/${encodeURIComponent(job_id)}`);
                renderMatches(result);

              } catch (e) {
                console.error('Matching error:', e);
                renderMatches({ query: input, matches: [], notes: 'Error fetching matches.' });
              } finally {
                // Re-enable UI
                btn.disabled = false;
                box.disabled = false;
                txt.textContent = 'Find Matches';
                spin.classList.add('d-none');
              }
            });

            const bioCache = new Map(); // name -> {name, bio}

            function attachBioHover(nameEl, personName) {
              if (!personName || personName === 'Unknown') return;

              let tooltip = null;
              let hideTimer = null;

              const showTooltip = async () => {
                // create tooltip if needed
                if (!tooltip) {
                  tooltip = document.createElement('div');
                  tooltip.className = 'custom-bio-tooltip alert alert-info shadow p-3';
                  tooltip.style.position = 'absolute';
                  tooltip.style.zIndex = 9999;
                  tooltip.style.width = '600px';
                  tooltip.style.maxWidth = '95vw';
                  tooltip.style.maxHeight = '60vh';
                  tooltip.style.overflow = 'auto';
                  tooltip.style.pointerEvents = 'auto'; // allow hover inside tooltip
                  tooltip.innerHTML = '<em>Loading bio...</em>';
                  document.body.appendChild(tooltip);

                  // Allow staying open when hovering tooltip
                  tooltip.addEventListener('mouseenter', () => {
                    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
                  });
                  tooltip.addEventListener('mouseleave', () => {
                    scheduleHide();
                  });
                }

                // position near name
                const rect = nameEl.getBoundingClientRect();
                tooltip.style.top = `${rect.bottom + window.scrollY + 6}px`;
                tooltip.style.left = `${rect.left + window.scrollX}px`;

                // populate content (from cache or fetch)
                try {
                  let data = bioCache.get(personName);
                  if (!data) {
                    data = await fetchJSON('/person/bio', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ person_name: personName })
                    });
                    bioCache.set(personName, data);
                  }

                  const { name, bio } = data || {};
                  tooltip.innerHTML = '';

                  const title = document.createElement('h5');
                  title.className = 'fw-bold mb-2';
                  title.textContent = name || personName;
                  tooltip.appendChild(title);

                  const bioEl = document.createElement('div');
                  bioEl.className = 'mb-0';

                  const parts = String(bio || '').split(/\n{2,}|\r?\n/).filter(Boolean);
                  if (parts.length === 0) {
                    const p = document.createElement('p');
                    p.className = 'mb-0';
                    p.textContent = 'Bio not available.';
                    bioEl.appendChild(p);
                  } else {
                    parts.forEach(txt => {
                      const p = document.createElement('p');
                      p.className = 'mb-2';
                      p.textContent = txt.trim();
                      bioEl.appendChild(p);
                    });
                  }
                  tooltip.appendChild(bioEl);
                } catch (err) {
                  console.error('Tooltip bio fetch error:', err);
                  tooltip.innerHTML = '<span class="text-danger">Error loading bio.</span>';
                }
              };

              const scheduleHide = () => {
                if (hideTimer) clearTimeout(hideTimer);
                hideTimer = setTimeout(() => {
                  if (tooltip) {
                    tooltip.remove();
                    tooltip = null;
                  }
                }, 200); // small delay so user can move from name to tooltip
              };

              // Hover behavior on the NAME (not the number prefix)
              nameEl.addEventListener('mouseenter', async () => {
                nameEl.style.textDecoration = 'underline';
                nameEl.style.color = '#0d6efd';
                if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
                await showTooltip();
              });

              nameEl.addEventListener('mouseleave', () => {
                nameEl.style.textDecoration = '';
                nameEl.style.color = '';
                scheduleHide();
              });
            }


            function renderMatches(payload) {
              const target = getEl('MatchResults');
              target.innerHTML = '';

              const hasResults =
                payload &&
                Array.isArray(payload.results) &&
                payload.results.some(r => Array.isArray(r.shortlist) && r.shortlist.length > 0);

              if (!hasResults) {
                target.innerHTML = `
                  <div class="alert alert-warning" role="alert">
                    No results found for this query.
                  </div>
                `;
                return;
              }

              const esc = (s) =>
                (typeof escapeHtml === 'function')
                  ? escapeHtml(String(s ?? ''))
                  : String(s ?? '')
                      .replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');

              const percent = (() => {
                const total = Number(payload.total_batches || 0);
                const done = Number(payload.completed || 0);
                if (!total) return 0;
                return Math.min(100, Math.max(0, Math.round((done / total) * 100)));
              })();

              const header = document.createElement('div');
              header.className = 'mb-3';
              header.innerHTML = `
                <div class="d-flex align-items-start justify-content-between flex-wrap gap-2">
                  <div>
                    <div class="fw-semibold">Query</div>
                    <div class="text-muted">${esc(payload.query || (payload.results?.[0]?.query || ''))}</div>
                  </div>
                  <div class="text-end">
                    <div class="d-flex align-items-center gap-2 justify-content-end flex-wrap">
                      <span class="badge ${payload.status === 'done' ? 'text-bg-success' : 'text-bg-info'}">${esc(payload.status || 'running')}</span>
                      <span class="small text-muted">${Number(payload.completed || 0)}/${Number(payload.total_batches || 0)} batches</span>
                    </div>
                    <div class="progress mt-2" role="progressbar" aria-label="progress">
                      <div class="progress-bar" style="width:${percent}%;" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100">${percent}%</div>
                    </div>
                  </div>
                </div>
                <div class="small text-muted mt-1">
                  Job ID: <code>${esc(payload.job_id || '')}</code>
                  ${payload.started_at ? ` • Started: ${esc(payload.started_at)}` : ''}
                  ${payload.finished_at ? ` • Finished: ${esc(payload.finished_at)}` : ''}
                </div>
              `;
              target.appendChild(header);

              const list = document.createElement('div');
              list.className = 'd-flex flex-column gap-3';
              target.appendChild(list);

              const toStaticHref = (src) => {
                if (!src) return '#';
                const cleaned = String(src).replace(/^\/?static\//, '').replace(/^\/+/, '');
                return encodeURI(`/static/${cleaned}`);
              };

              const confidenceBadgeClass = (c) => {
                const v = Number(c);
                if (v >= 0.9) return 'text-bg-success';
                if (v >= 0.75) return 'text-bg-primary';
                if (v >= 0.5) return 'text-bg-warning';
                return 'text-bg-secondary';
              };

              let rank = 0;
              payload.results.forEach((group) => {
                const shortlist = Array.isArray(group.shortlist) ? group.shortlist : [];
                if (!shortlist.length) return;

                // Optional subheader if multiple groups are present
                if ((payload.results?.length || 0) > 1) {
                  const sub = document.createElement('div');
                  sub.className = 'mt-2';
                  sub.innerHTML = `
                    <div class="fw-semibold">Group Query</div>
                    <div class="text-muted">${esc(group.query || '')}</div>
                  `;
                  list.appendChild(sub);
                }

                shortlist.forEach((m) => {
                  rank += 1;

                  const card = document.createElement('div');
                  card.className = 'card shadow-sm';

                  const body = document.createElement('div');
                  body.className = 'card-body';

                  // Title row
                  const title = document.createElement('div');
                  title.className = 'd-flex align-items-start justify-content-between flex-wrap gap-2';

                  const nameEl = document.createElement('h5');
                  nameEl.className = 'card-title mb-0 fw-bold person-name';
                  nameEl.style.cursor = 'pointer';

                  const numSpan = document.createElement('span');
                  numSpan.className = 'text-muted me-2';
                  numSpan.textContent = `${rank}.`;

                  const textSpan = document.createElement('span');
                  textSpan.textContent = m.name || 'Unknown';

                  nameEl.appendChild(numSpan);
                  nameEl.appendChild(textSpan);
                  title.appendChild(nameEl);

                  const badgeWrap = document.createElement('div');
                  badgeWrap.className = 'd-flex gap-2 align-items-center flex-wrap';

                  const scoreBadge = document.createElement('span');
                  scoreBadge.className = 'badge text-bg-dark';
                  scoreBadge.textContent = `score ${Math.round(Number(m.score || 0))}`;
                  badgeWrap.appendChild(scoreBadge);

                  if (m.confidence != null) {
                    const confBadge = document.createElement('span');
                    confBadge.className = `badge ${confidenceBadgeClass(m.confidence)}`;
                    confBadge.textContent = `conf ${Number(m.confidence).toFixed(2)}`;
                    badgeWrap.appendChild(confBadge);
                  }

                  title.appendChild(badgeWrap);
                  body.appendChild(title);

                  // Hover for bios (if provided by your app)
                  if (typeof attachBioHover === 'function') {
                    attachBioHover(textSpan, m.name || 'Unknown');
                  }

                  // Summary
                  if (m.summary) {
                    const p = document.createElement('p');
                    p.className = 'mt-2 mb-2';
                    p.textContent = m.summary;
                    body.appendChild(p);
                  }

                  // Fit tags
                  if (Array.isArray(m.fit_tags) && m.fit_tags.length) {
                    const tagsWrap = document.createElement('div');
                    tagsWrap.className = 'd-flex gap-2 flex-wrap mb-2';
                    m.fit_tags.forEach(tag => {
                      if (!tag) return;
                      const b = document.createElement('span');
                      b.className = 'badge text-bg-light text-dark border';
                      b.textContent = tag;
                      tagsWrap.appendChild(b);
                    });
                    body.appendChild(tagsWrap);
                  }

                  // Evidence
                  if (Array.isArray(m.evidence) && m.evidence.length) {
                    const details = document.createElement('details');
                    details.className = 'mt-2';
                    const summary = document.createElement('summary');
                    summary.className = 'small';
                    summary.textContent = `Evidence (${m.evidence.length})`;
                    details.appendChild(summary);

                    const evWrap = document.createElement('div');
                    evWrap.className = 'mt-2';

                    m.evidence.forEach((ev) => {
                      const item = document.createElement('div');
                      item.className = 'mb-2';

                      if (ev.source) {
                        const a = document.createElement('a');
                        a.href = toStaticHref(ev.source);
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.className = 'small d-inline-block';
                        a.textContent = ev.source;
                        item.appendChild(a);
                      }

                      if (ev.snippet) {
                        const sn = document.createElement('blockquote');
                        sn.className = 'blockquote small mb-0 mt-1';
                        sn.textContent = ev.snippet;
                        item.appendChild(sn);
                      }

                      evWrap.appendChild(item);
                    });

                    details.appendChild(evWrap);
                    body.appendChild(details);
                  }

                  card.appendChild(body);
                  list.appendChild(card);
                });
              });
            }


            function escapeHtml(str) {
              return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
            }

            document.addEventListener('DOMContentLoaded',()=>{
              loadEntities();
            });
            </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
