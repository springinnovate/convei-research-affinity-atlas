<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Academic Affinity Atlas</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-primary navbar-dark mb-4">
            <div class="container">
                <a class="navar-brand" href="#">Academic Affinity Atlas</a>
            </div>
        </nav>

        <div class="container">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title">
                        Analyze a Conference or Academic URL
                    </h5>
                    <form id="crawl-form" class="row g-2">
                        <div class="col-md-8">
                            <input
                                type="url"
                                class="form-control"
                                id="url"
                                placeholder="URL to analyze"
                                required
                            />
                        </div>
                        <div class="col-md-2">
                            <input
                                type="number"
                                class="form-control"
                                id="max-pages"
                                placeholder="Max pages"
                                required
                                value="1"
                            />
                        </div>
                        <div class="col-md-2">
                            <button
                                type="submit"
                                class="btn btn-primary w-IN_PROGRESS_CRAWL_POLL_TIME"
                                id="crawl-btn"
                            >
                                <span id="crawl-btn-text">Start Crawl</span>
                                <span
                                    id="crawl-btn-spinner"
                                    class="spinner-border spinner-border-sm d-none"
                                    role="status"
                                ></span>
                            </button>
                        </div>
                    </form>

                    <h6 class="mt-4">Active Crawls</h6>
                    <div id="crawl-status-list"></div>
                </div>
            </div>

            <h4 class="mt-5 mb-3">Entities Found</h4>
            <div id="EntitiesSelectContainer">
                <!-- The value select element will be inserted here -->
            </div>

            <h4 class="mb-3">Crawled Pages</h4>
            <div class="accordion" id="urlAccordion"></div>
        </div>

        <script>
            const DEFAULT_CRAWL_POLL_TIME = 10000,
                  IN_PROGRESS_CRAWL_POLL_TIME = 5000;

            let crawlInterval,
                currentIntervalDelay = DEFAULT_CRAWL_POLL_TIME;

            const activeCrawlIds = new Set(),
                  knownUrls = new Set();

            const getEl = id => document.getElementById(id);
            const fetchJSON = (u,o) => fetch(u,o).then(r => r.json());

            function startCrawlPolling(delay){
              clearInterval(crawlInterval);
              currentIntervalDelay = delay;
              crawlInterval = setInterval(loadActiveCrawls, delay);
            }

            function createOrGetRow(id){
              let row = getEl('crawl-row-'+id);
              if(!row){
                row = document.createElement('div');
                row.id = 'crawl-row-'+id;
                row.className = 'alert alert-info py-1 mb-2';
                getEl('crawl-status-list').appendChild(row);
              }
              return row;
            }

            const updateRow = (row,msg,done=false)=>
              (row.textContent = msg,
               row.className = `alert ${done?'alert-success':'alert-info'} py-1 mb-2`);

            function loadActiveCrawls(){
              fetchJSON('/active_crawls/').then(data=>{
                const ids = Object.keys(data);
                ids.filter(id=>!activeCrawlIds.has(id)).forEach(id=>{
                  activeCrawlIds.add(id);
                  pollStatus(id);
                });
                const currentPollTime = ids.length ? IN_PROGRESS_CRAWL_POLL_TIME
                                           : DEFAULT_CRAWL_POLL_TIME;
                if(currentPollTime !== currentIntervalDelay) startCrawlPolling(currentPollTime);
              }).catch(console.error);
            }

            getEl('crawl-form').addEventListener('submit',e=>{
              e.preventDefault();
              const url = getEl('url').value,
                    max_pages = +getEl('max-pages').value,
                    btn = getEl('crawl-btn'),
                    txt = getEl('crawl-btn-text'),
                    spn = getEl('crawl-btn-spinner');

              btn.disabled = true;
              txt.textContent = 'Crawling...';
              spn.classList.remove('d-none');
              startCrawlPolling(IN_PROGRESS_CRAWL_POLL_TIME);

              fetchJSON('/start_crawl/',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({url,max_pages})
              }).then(({crawl_id:id})=>{
                activeCrawlIds.add(id);
                pollStatus(id,()=>{
                  btn.disabled = false;
                  txt.textContent = 'Start Crawl';
                  spn.classList.add('d-none');
                });
              });
            });

            function pollStatus(crawlId, done) {
              const row = createOrGetRow(crawlId);
              const int = setInterval(() => {
                fetchJSON('/crawl_status', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ crawl_id: crawlId })
                })
                  .then(s => {
                    if (s.error) {
                      updateRow(row, s.error, true);
                      clearInterval(int);
                      done?.();
                      return;
                    }

                    const url    = new URL(crawlId);
                    const status = `Processed: ${s.processed} | Fetched: ${s.fetched} | Discovered: ${s.discovered}`;

                    updateRow(row, `[${status}] ${url.hostname}${url.pathname}`, s.completed);
                    loadUrls();
                    loadEntities();

                    if (s.completed) {
                      clearInterval(int);
                      done?.();
                    }
                  })
                  .catch(() => {
                    updateRow(row, 'Error checking status', true);
                    clearInterval(int);
                    done?.();
                  });
              }, IN_PROGRESS_CRAWL_POLL_TIME);
            }

            function loadUrls(){
              fetchJSON('/urls/').then(({urls})=>{
                const acc = getEl('urlAccordion');
                urls.forEach(item=>{
                  if(knownUrls.has(item.id)) return;
                  knownUrls.add(item.id);

                  const it = document.createElement('div');
                  it.className = 'accordion-item';
                  const title = item.title || 'No title';

                  if(item.has_content){
                    it.innerHTML = `
            <h2 class='accordion-header' id='heading${item.id}'>
             <button class='accordion-button collapsed' type='button' data-bs-toggle='collapse'
                     data-bs-target='#collapse${item.id}'>${title}: (<a href='${item.url}'>${item.url}</a>)</button>
            </h2>
            <div id='collapse${item.id}' class='accordion-collapse collapse' data-bs-parent='#urlAccordion'>
             <div class='accordion-body'><div id='content-${item.id}'>Loading content...</div></div>
            </div>`;
                    it.querySelector(`#collapse${item.id}`).addEventListener('show.bs.collapse',()=>{
                      fetchJSON(`/urlcontent/${item.id}`).then(c=>{
                        getEl(`content-${item.id}`).textContent = c.text_content;
                      });
                    },{once:true});
                  }else{
                    it.innerHTML = `<div class='accordion-header'>
                                      <div class='p-3'>${title}: (${item.url})</div>
                                    </div>`;
                  }
                  acc.appendChild(it);
                });
              });
            }

            async function loadEntities(){
              const container = getEl('EntitiesSelectContainer');
              container.innerHTML = `
                <select id='EntitiesSelect' multiple style='width:100%'></select>
                <div id='bioContainer' class='mt-4'></div>`;
              const select = getEl('EntitiesSelect'),
                    bioDiv = getEl('bioContainer');
              let previous = new Set();

              try{
                const {entities} = await fetchJSON('/entities/');
                select.innerHTML = entities.map(n=>`<option value='${n}'>${n}</option>`).join('');
                $(select).select2({placeholder:'Search and select Entities',allowClear:true,width:'100%'})
                  .on('change',async function(){
                    const current = new Set($(this).val()||[]);
                    previous.forEach(id=>!current.has(id)&&getEl(`bio-${CSS.escape(id)}`)?.remove());
                    await Promise.all([...current].filter(id=>!previous.has(id)).map(async id=>{
                      const d = document.createElement('div');
                      d.id = `bio-${id}`; d.textContent = `Loading bio for ${id}...`;
                      bioDiv.appendChild(d);
                      try{
                        const {name,bio} = await fetchJSON('/person/bio',{
                          method:'POST',
                          headers:{'Content-Type':'application/json'},
                          body:JSON.stringify({person_name:id})
                        });
                        d.innerHTML = `<strong>${name}:</strong> ${bio}<br>`;
                      }catch{}
                    }));
                    previous = current;
                  });
              }catch{
                container.textContent = 'Failed to load entities.';
              }
            }

            document.addEventListener('DOMContentLoaded',()=>{
              loadUrls(); loadActiveCrawls(); loadEntities();
              startCrawlPolling(DEFAULT_CRAWL_POLL_TIME);
            });
            </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
