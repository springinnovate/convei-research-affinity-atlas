<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Academic Affinity Atlas</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-primary navbar-dark mb-4">
            <div class="container">
                <a class="navar-brand" href="#">Academic Affinity Atlas</a>
            </div>
        </nav>

        <div class="container">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title">
                        Analyze a Conference or Academic URL
                    </h5>
                    <form id="crawl-form" class="row g-2">
                        <div class="col-md-8">
                            <input
                                type="url"
                                class="form-control"
                                id="url"
                                placeholder="URL to analyze"
                                required
                            />
                        </div>
                        <div class="col-md-2">
                            <input
                                type="number"
                                class="form-control"
                                id="max-pages"
                                placeholder="Max pages"
                                required
                                value="1"
                            />
                        </div>
                        <div class="col-md-2">
                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                                id="crawl-btn"
                            >
                                <span id="crawl-btn-text">Start Crawl</span>
                                <span
                                    id="crawl-btn-spinner"
                                    class="spinner-border spinner-border-sm d-none"
                                    role="status"
                                ></span>
                            </button>
                        </div>
                    </form>

                    <h6 class="mt-4">Active Crawls</h6>
                    <div id="crawl-status-list"></div>
                </div>
            </div>

            <h4 class="mt-5 mb-3">Entities Found</h4>
            <div id="EntitiesSelectContainer">
                <!-- The value select element will be inserted here -->
            </div>

            <h4 class="mb-3">Crawled Pages</h4>
            <div class="accordion" id="urlAccordion"></div>
        </div>

        <script>
            let crawlInterval = null;
            let currentIntervalDelay = 4000;

            function startCrawlPolling(delay) {
                if (crawlInterval) clearInterval(crawlInterval);
                currentIntervalDelay = delay;
                crawlInterval = setInterval(loadActiveCrawls, delay);
            }
            const activeCrawlIds = new Set();
            function createOrGetRow(id) {
                let row = document.getElementById("crawl-row-" + id);
                if (!row) {
                    row = document.createElement("div");
                    row.id = "crawl-row-" + id;
                    row.className = "alert alert-info py-1 mb-2";
                    document
                        .getElementById("crawl-status-list")
                        .appendChild(row);
                }
                return row;
            }
            function updateRow(row, msg, done = false) {
                row.textContent = msg;
                row.className =
                    "alert " +
                    (done ? "alert-success" : "alert-info") +
                    " py-1 mb-2";
            }

            function loadActiveCrawls() {
                fetch("/active_crawls/")
                    .then((r) => r.json())
                    .then((data) => {
                        const newCrawls = Object.keys(data).filter((id) => !activeCrawlIds.has(id));
                        newCrawls.forEach((id) => {
                            activeCrawlIds.add(id);
                            pollStatus(id);
                        });

                        // Dynamically adjust interval
                        if (newCrawls.length > 0 && currentIntervalDelay !== 100) {
                            startCrawlPolling(100);
                        } else if (Object.keys(data).length === 0 && currentIntervalDelay !== 4000) {
                            startCrawlPolling(4000);
                        }
                    })
                    .catch((err) => {
                        console.error("Error checking active crawls:", err);
                    });
            }

            document
                .getElementById("crawl-form")
                .addEventListener("submit", (e) => {
                    e.preventDefault();
                    const url = document.getElementById("url").value;
                    const max_pages = parseInt(
                        document.getElementById("max-pages").value,
                    );
                    const btn = document.getElementById("crawl-btn");
                    const txt = document.getElementById("crawl-btn-text");
                    const spn = document.getElementById("crawl-btn-spinner");
                    btn.disabled = true;
                    startCrawlPolling(100);
                    txt.textContent = "Crawling...";
                    spn.classList.remove("d-none");

                    fetch("/start_crawl/", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ url, max_pages }),
                    })
                        .then((r) => r.json())
                        .then((d) => {
                            const id = d.crawl_id;
                            activeCrawlIds.add(id);
                            pollStatus(id, () => {
                                btn.disabled = false;
                                txt.textContent = "Start Crawl";
                                spn.classList.add("d-none");
                            });
                        });
                });

                function pollStatus(crawlId, doneCallback) {
                    const row = createOrGetRow(crawlId);
                    const int = setInterval(() => {
                        fetch(`/crawl_status`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ crawl_id: crawlId })
                        })
                        .then((r) => r.json())
                        .then((s) => {
                            if (s.error) {
                                updateRow(row, s.error, true);
                                clearInterval(int);
                                if (doneCallback) doneCallback();
                            } else {
                                const url = new URL(crawlId);
                                const statusText = (s.analyzed === s.discovered) && (s.discovered > 0)
                                  ? 'complete'
                                  : `${s.analyzed}/${s.discovered}`;

                                updateRow(
                                  row,
                                  `[${statusText}] ${url.hostname}${url.pathname}`,
                                  s.completed,
                                );
                                loadUrls();
                                loadEntities();
                                if (s.completed) {
                                    clearInterval(int);
                                    if (doneCallback) doneCallback();
                                }
                            }
                        })
                        .catch(() => {
                            updateRow(row, "Error checking status", true);
                            clearInterval(int);
                            if (doneCallback) doneCallback();
                        });
                    }, 2000);
                }

            /* ---------------- URLs accordion ---------------- */
            let knownUrls = new Set();
            function loadUrls() {
                fetch("/urls/")
                    .then((r) => r.json())
                    .then((data) => {
                        const acc = document.getElementById("urlAccordion");
                        data.urls.forEach((item) => {
                            if (knownUrls.has(item.id)) return;
                            knownUrls.add(item.id);
                            const it = document.createElement("div");
                            it.className = "accordion-item";
                            if (item.has_content) {
                                it.innerHTML = `
<h2 class='accordion-header' id='heading${item.id}'>
 <button class='accordion-button collapsed' type='button' data-bs-toggle='collapse' data-bs-target='#collapse${item.id}'>
  ${item.title ? item.title : "No title"}: (<a href='${item.url}'>${item.url}</a>)
 </button>
</h2>
<div id='collapse${item.id}' class='accordion-collapse collapse' data-bs-parent='#urlAccordion'>
 <div class='accordion-body'><div id='content-${item.id}'>Loading content...</div></div>
</div>`;
                                acc.appendChild(it);
                                it.querySelector(
                                    `#collapse${item.id}`,
                                ).addEventListener(
                                    "show.bs.collapse",
                                    () => {
                                        fetch(`/urlcontent/${item.id}`)
                                            .then((r) => r.json())
                                            .then((c) => {
                                                document.getElementById(
                                                    `content-${item.id}`,
                                                ).textContent = c.text_content;
                                            });
                                    },
                                    { once: true },
                                );
                            } else {
                                it.innerHTML = `<div class='accordion-header'><div class='p-3'>${item.title ? item.title : "No title"}: (${item.url})</div></div>`;
                                acc.appendChild(it);
                            }
                        });
                    });
            }

            let knownEntities = new Set();
            function loadEntities() {
                fetch("/entities/")
                    .then((r) => r.json())
                    .then((data) => {
                        const EntitiesSelectContainer = document.getElementById("EntitiesSelectContainer");
                        EntitiesSelectContainer.innerHTML = '';

                        const select = document.createElement('select');
                        select.id = 'EntitiesSelect';
                        select.style.width = '100%';
                        select.multiple = true;  // <-- Enable multiple selection here

                        data.entities.forEach((name) => {
                            const option = document.createElement('option');
                            option.value = name;
                            option.text = name;
                            select.appendChild(option);
                        });

                        EntitiesSelectContainer.appendChild(select);

                        $(select).select2({
                            placeholder: 'Search and select Entities',
                            allowClear: true,
                            width: '100%',
                        });

                        $(select).on('change', function() {
                            const selectedIds = $(this).val();  // now an array of ids
                            const bioContainer = document.getElementById("personBio");

                            if (selectedIds && selectedIds.length > 0) {
                                bioContainer.innerHTML = '';  // Clear previous bios
                                selectedIds.forEach(personId => {
                                    fetch(`/person/${personId}/bio`)
                                        .then((r) => r.json())
                                        .then((b) => {
                                            const bioDiv = document.createElement('div');
                                            bioDiv.innerHTML = `<strong>${b.name}:</strong> ${b.bio}<br>`;
                                            bioContainer.appendChild(bioDiv);
                                        })
                                        .catch(() => {
                                            const bioDiv = document.createElement('div');
                                            bioDiv.innerText = `Failed to generate bio for ID: ${personId}`;
                                            bioContainer.appendChild(bioDiv);
                                        });
                                });
                            } else {
                                bioContainer.innerHTML = '';
                            }
                        });
                    });
            }

            document.addEventListener("DOMContentLoaded", () => {
                loadUrls();
                loadActiveCrawls();
                loadEntities();
                startCrawlPolling(4000);
            });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
