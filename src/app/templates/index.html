<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Academic Affinity Atlas</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-primary navbar-dark mb-4">
            <div class="container">
                <a class="navar-brand" href="#">Academic Affinity Atlas</a>
            </div>
        </nav>

        <div class="container">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title">
                        Analyze a Conference or Academic URL
                    </h5>
                    <form id="crawl-form" class="row g-2">
                        <div class="col-md-8">
                            <input
                                type="url"
                                class="form-control"
                                id="url"
                                placeholder="URL to analyze"
                                required
                            />
                        </div>
                        <div class="col-md-2">
                            <input
                                type="number"
                                class="form-control"
                                id="max-pages"
                                placeholder="Max pages"
                                required
                                value="1"
                            />
                        </div>
                        <div class="col-md-2">
                            <button
                                type="submit"
                                class="btn btn-primary w-IN_PROGRESS_CRAWL_POLL_TIME"
                                id="crawl-btn"
                            >
                                <span id="crawl-btn-text">Start Crawl</span>
                                <span
                                    id="crawl-btn-spinner"
                                    class="spinner-border spinner-border-sm d-none"
                                    role="status"
                                ></span>
                            </button>
                        </div>
                    </form>

                    <h6 class="mt-4">Active Crawls</h6>
                    <div id="crawl-status-list"></div>
                </div>
            </div>

            <h4 class="mt-5 mb-3">Find Interesting People</h4>
              <div id="MatchPeopleContainer">
                <textarea id="UserInterestText"
                          class="form-control mb-2"
                          rows="3"
                          placeholder="Describe your research interests here"></textarea>

                <button id="MatchPeopleBtn" class="btn btn-primary">
                  <span id="MatchPeopleBtnText">Find Matches</span>
                  <span id="MatchPeopleBtnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>

                <div id="MatchResults" class="mt-3"></div>
              </div>

            <h4 class="mt-5 mb-3">Search For People</h4>
            <div id="EntitiesSelectContainer">
                <!-- The value select element will be inserted here -->
            </div>

            <h4 class="mb-3">Indexed Pages</h4>
            <div id="urlListContainer" class="mt-4"></div>
        </div>

        <script>
            const DEFAULT_CRAWL_POLL_TIME = 10000,
                  IN_PROGRESS_CRAWL_POLL_TIME = 5000;

            let crawlInterval,
                currentIntervalDelay = DEFAULT_CRAWL_POLL_TIME;

            const activeCrawlIds = new Set(),
                  knownUrls = new Set();

            function resetCrawlBtn() {
              const btn = getEl('crawl-btn'),
                    txt = getEl('crawl-btn-text'),
                    spn = getEl('crawl-btn-spinner');

              btn.disabled = false;
              txt.textContent = 'Start Crawl';
              spn.classList.add('d-none');
            }

            const getEl = id => document.getElementById(id);
            const fetchJSON = (u,o) => fetch(u,o).then(r => r.json());

            function startCrawlPolling(delay){
              clearInterval(crawlInterval);
              currentIntervalDelay = delay;
              crawlInterval = setInterval(loadActiveCrawls, delay);
            }

            function createOrGetRow(id){
              let row = getEl('crawl-row-'+id);
              if(!row){
                row = document.createElement('div');
                row.id = 'crawl-row-'+id;
                row.className = 'alert alert-info py-1 mb-2';
                getEl('crawl-status-list').appendChild(row);
              }
              return row;
            }

            const updateRow = (row,msg,done=false)=>
              (row.textContent = msg,
               row.className = `alert ${done?'alert-success':'alert-info'} py-1 mb-2`);

            function loadActiveCrawls(){
              fetchJSON('/active_crawls/').then(data=>{
                const ids = Object.keys(data);
                ids.filter(id=>!activeCrawlIds.has(id)).forEach(id=>{
                  activeCrawlIds.add(id);
                });
                ids.forEach(id=>{
                  pollStatus(id);
                });
                const currentPollTime = ids.length ? IN_PROGRESS_CRAWL_POLL_TIME
                                           : DEFAULT_CRAWL_POLL_TIME;
                if(currentPollTime !== currentIntervalDelay) startCrawlPolling(currentPollTime);
              }).catch(console.error);
            }

            getEl('crawl-form').addEventListener('submit',e=>{
              e.preventDefault();
              const url = getEl('url').value,
                    max_pages = +getEl('max-pages').value,
                    btn = getEl('crawl-btn'),
                    txt = getEl('crawl-btn-text'),
                    spn = getEl('crawl-btn-spinner');

              btn.disabled = true;
              txt.textContent = 'Crawling...';
              spn.classList.remove('d-none');
              startCrawlPolling(IN_PROGRESS_CRAWL_POLL_TIME);

              fetchJSON('/start_crawl/',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({url,max_pages})
              }).then(({crawl_id:id})=>{
                activeCrawlIds.add(id);
                pollStatus(id);
              });
            });

            function pollStatus(crawlId) {
              const row = createOrGetRow(crawlId);
              fetchJSON('/crawl_status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ crawl_id: crawlId })
              })
                .then(s => {
                  if (s.error) {
                    updateRow(row, s.error, true);
                    return;
                  }

                  const url    = new URL(crawlId);
                  const prefix = s.completed ? 'Completed analysis' : 'In progress';
                  const status = `${prefix}: Processed: ${s.processed} | Fetched: ${s.fetched} | Discovered: ${s.discovered}`;
                  const alertClass = s.completed ? 'alert-success' : 'alert-warning';

                  row.className = `alert ${alertClass} py-1 mb-2`;
                  updateRow(row, `[${status}] ${url.hostname}${url.pathname}`, s.completed);
                  loadUrls();
                  loadEntities();

                  if (s.completed) {
                    activeCrawlIds.delete(crawlId);   // mark done
                    if (activeCrawlIds.size === 0) resetCrawlBtn();
                  }
                })
                .catch(() => {
                  updateRow(row, 'Error checking status', true);
                  activeCrawlIds.delete(crawlId);
                  if (activeCrawlIds.size === 0) resetCrawlBtn();
                });
            }

            function loadUrls(){
              fetchJSON('/urls/').then(({top_level_domains}) => {
                const container = getEl('urlListContainer');
                container.innerHTML = ''; // clear old content

                top_level_domains.forEach(({domain, url_count}) => {
                  const div = document.createElement('div');
                  div.className = 'alert alert-secondary py-1 mb-1';
                  div.textContent = `${domain} → ${url_count} URL${url_count !== 1 ? 's' : ''}`;
                  container.appendChild(div);
                });
              });
            }

            async function loadEntities() {
              const c = getEl('EntitiesSelectContainer');
              if (!getEl('EntitiesSelect')) {
                c.innerHTML = `<select id='EntitiesSelect' multiple style='width:100%'></select><div id='bioContainer' class='mt-4'></div>`;
                const s = $('#EntitiesSelect').select2({ placeholder: 'Search and select Entities', allowClear: true, width: '100%' });
                let prev = new Set();
                s.on('change', async () => {
                  const cur = new Set(s.val() || []);
                  prev.forEach(id => !cur.has(id) && getEl(`bio-${CSS.escape(id)}`)?.remove());
                  await Promise.all([...cur].filter(id => !prev.has(id)).map(async id => {
                    const div = Object.assign(document.createElement('div'), { id: `bio-${id}`, textContent: `Loading bio for ${id}...` });
                    getEl('bioContainer').appendChild(div);
                    try {
                      const { name, bio } = await fetchJSON('/person/bio', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ person_name: id }) });
                      div.innerHTML = `<strong>${name}:</strong> ${bio}<br>`;
                    } catch {}
                  }));
                  prev = cur;
                });
              }

              try {
                const { entities } = await fetchJSON('/entities/');
                const sel = getEl('EntitiesSelect');
                const existing = new Set([...sel.options].map(o => o.value));
                entities.filter(e => !existing.has(e)).forEach(e => sel.add(new Option(e, e)));
                $(sel).trigger('change.select2');
              } catch {
                c.textContent = 'Failed to load entities.';
              }
            }

            function showMatches(matches) {
              const out = getEl('MatchResults');
              if (!matches.length) {
                out.textContent = 'No relevant people found.';
                return;
              }
              out.innerHTML = matches.map(m => {
                const urlList = m.urls ? `<ul>${m.urls.map(url => `<li><a href="${url}" target="_blank">${url}</a></li>`).join('')}</ul>` : '';
                return `<div class="alert alert-info py-1 mb-2">
                          <strong>${m.name}</strong> — score ${m.relevance_score}<br>
                          <em>${m.rationale}</em><br>
                          <small>${m.bio_quote}</small>
                          ${urlList}
                        </div>`;
              }).join('');
            }

            getEl('MatchPeopleBtn').addEventListener('click', async () => {
              const btn  = getEl('MatchPeopleBtn'),
                    txt  = getEl('MatchPeopleBtnText'),
                    spin = getEl('MatchPeopleBtnSpinner'),
                    box  = getEl('UserInterestText'),
                    input = box.value.trim();

              if (!input) return;

              // UI: disable & spin
              btn.disabled = true;
              txt.textContent = 'Generating bios...';
              spin.classList.remove('d-none');

              try {
                // First update all bios
                await fetchJSON('/generate_all_bios', { method: 'POST' });

                // Update UI status to matching
                txt.textContent = 'Matching...';

                // Now fetch matches
                const matches = await fetchJSON('/match_people', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ user_interest_text: input })
                });

                showMatches(matches || []);

              } catch (e) {
                getEl('MatchResults').textContent = 'Error fetching matches.';
                console.error(e);
              } finally {
                btn.disabled = false;
                txt.textContent = 'Find Matches';
                spin.classList.add('d-none');
              }
            });

            document.addEventListener('DOMContentLoaded',()=>{
              loadUrls();
              loadActiveCrawls();
              loadEntities();
              startCrawlPolling(DEFAULT_CRAWL_POLL_TIME);
            });
            </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
