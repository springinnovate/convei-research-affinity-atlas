example_crawl:
  # Where to start crawling
  start_urls:
    - https://www.example.com/start-page

  # What's allowed to be crawled
  allowed_scopes:
    - https://www.example.com

  # Optional: restrict parsing to certain sections of the page.
  # These are CSS selectors. Set to `content_sections: null` to parse
  # the full page.
  content_sections:
    - article.content.section
    - div.main-content

  # Elements to drop from matched content sections
  drop_elements:
    - path
    - script
    - svg
    - form
    - textarea
    - input

  # Abstract entities you expect to extract later
  entities:
    - Item
    - Category
    - DetailPage

  # Page limit:
  #   - integer: stop after this many pages
  #   - 'no_limit': crawl everything within allowed_scopes
  max_pages: 1  # or 'no_limit'

  # Concurrency and throttling
  workers: 4               # number of parallel workers
  requests_per_second: 1.0 # global rate limit, float, per second

  # Output configuration
  output:
    sqlite_path: './data/example_crawl.sqlite'
