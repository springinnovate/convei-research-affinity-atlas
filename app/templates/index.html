<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Academic Affinity Atlas</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}">


    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-primary navbar-dark mb-4">
            <div class="container">
                <a class="navar-brand" href="#">Academic Affinity Atlas</a>
            </div>
        </nav>

        <div class="container">
            <h4 class="mb-3"><a href="https://events.rdmobile.com/Sessions/Index/19095" target="_blank">ESA 2025</a> - CONVEI Academic Affinity Atlas</h4>
            <div id="infoContainer" class="mt-4"></div>

            <h4 class="mt-5 mb-3">Find Interesting People</h4>
              <div id="MatchPeopleContainer">
                <textarea id="UserInterestText"
                          class="form-control mb-2"
                          rows="3"
                          placeholder="Tell us your topics, keywords, frameworks, areas of interest, and/or anything else, and we’ll use ESA 2025's participant bios, abstracts, and session information to help you discover people whose work aligns with those ideas."></textarea>

                <button id="MatchPeopleBtn" class="btn btn-primary">
                  <span id="MatchPeopleBtnText">Find Matches</span>
                  <span id="MatchPeopleBtnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>

                <div id="MatchResults" class="mt-3"></div>
              </div>

            <h4 class="mt-5 mb-3">Search For People</h4>
            <div id="EntitiesSelectContainer">
                <!-- The value select element will be inserted here -->
            </div>

        </div>

        <script>
            const getEl = id => document.getElementById(id);
            const fetchJSON = (u,o) => fetch(u,o).then(r => r.json());

            function createOrGetRow(id){
              let row = getEl('crawl-row-'+id);
              if(!row){
                row = document.createElement('div');
                row.id = 'crawl-row-'+id;
                row.className = 'alert alert-info py-1 mb-2';
                getEl('crawl-status-list').appendChild(row);
              }
              return row;
            }

            const updateRow = (row,msg,done=false)=>
              (row.textContent = msg,
               row.className = `alert ${done?'alert-success':'alert-info'} py-1 mb-2`);

            function loadDbInfo(){
              fetchJSON('/get_info/')
                .then(({ dbInfo }) => {
                  const container = getEl('infoContainer');
                  container.innerHTML = '';

                  const alertDiv = document.createElement('div');
                  alertDiv.className = 'alert alert-info d-flex align-items-center';
                  alertDiv.setAttribute('role', 'alert');

                  const icon = document.createElement('i');
                  icon.className = 'bi bi-info-circle-fill me-2'; // needs Bootstrap Icons
                  alertDiv.appendChild(icon);

                  const textSpan = document.createElement('span');
                  textSpan.textContent = dbInfo || 'No database info available.';
                  alertDiv.appendChild(textSpan);

                  container.append(alertDiv);
                })
                .catch(err => {
                  console.error('Error loading DB info:', err);
                  const container = getEl('infoContainer');
                  container.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                      Failed to load database info
                    </div>`;
                });
            }

            async function loadEntities() {
              const c = getEl('EntitiesSelectContainer');
              if (!getEl('EntitiesSelect')) {
                c.innerHTML = `
                  <select id="EntitiesSelect" multiple style="width:100%"></select>
                  <div id="bioContainer" class="mt-4"></div>
                `;
                const s = $('#EntitiesSelect').select2({
                  placeholder: 'Search and select Entities',
                  allowClear: true,
                  width: '100%'
                });

                let prev = new Set();

                s.on('change', async () => {
                  const cur = new Set(s.val() || []);

                  // remove cards for items that were deselected
                  prev.forEach(id => {
                    if (!cur.has(id)) {
                      const el = getEl(`bio-${id}`);
                      if (el) el.remove();
                    }
                  });

                  // add cards for newly-selected items
                  const toAdd = [...cur].filter(id => !prev.has(id));
                  await Promise.all(
                    toAdd.map(async id => {
                      const container = getEl('bioContainer');

                      // placeholder card
                      const card = document.createElement('div');
                      card.id = `bio-${id}`;
                      card.className = 'alert alert-primary p-3 mb-3';
                      card.innerHTML = `
                        <div class="placeholder-glow">
                          <span class="placeholder col-6"></span>
                          <span class="placeholder col-12 mt-2"></span>
                          <span class="placeholder col-8 mt-2"></span>
                        </div>
                      `;
                      container.appendChild(card);

                      try {
                        const { name, bio, url_list } = await fetchJSON('/person/bio', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ person_name: id })
                        });

                        // rebuild pretty card
                        card.innerHTML = '';
                        const title = document.createElement('h5');
                        title.className = 'fw-bold mb-2';
                        title.textContent = name;

                        const bioEl = document.createElement('div');
                        bioEl.className = 'mb-2';

                        // preserve line breaks into paragraphs
                        const parts = String(bio || '').split(/\n{2,}|\r?\n/).filter(Boolean);
                        if (parts.length === 0) {
                          const p = document.createElement('p');
                          p.className = 'mb-2';
                          p.textContent = 'Bio not available.';
                          bioEl.appendChild(p);
                        } else {
                          parts.forEach(txt => {
                            const p = document.createElement('p');
                            p.className = 'mb-2';
                            p.textContent = txt.trim();
                            bioEl.appendChild(p);
                          });
                        }

                        card.appendChild(title);
                        card.appendChild(bioEl);

                        if (Array.isArray(url_list) && url_list.length) {
                          const listWrap = document.createElement('div');
                          listWrap.className = 'mt-2';

                          const ul = document.createElement('ul');
                          ul.className = 'small mb-0 ps-3';
                          url_list.forEach(u => {
                            if (!u) return;
                            const li = document.createElement('li');
                            const a = document.createElement('a');
                            a.href = u;
                            a.target = '_blank';
                            a.rel = 'noopener noreferrer';
                            a.textContent = u;
                            li.appendChild(a);
                            ul.appendChild(li);
                          });

                          listWrap.appendChild(ul);
                          card.appendChild(listWrap);
                        }
                      } catch (e) {
                        console.error('Error fetching bio:', e);
                        card.className = 'alert alert-danger p-3 mb-3';
                        card.textContent = `Failed to load bio for ${id}`;
                      }
                    })
                  );

                  prev = cur;
                });
              }

              try {
                const { entities } = await fetchJSON('/entities/');
                const sel = getEl('EntitiesSelect');
                const existing = new Set([...sel.options].map(o => o.value));
                entities.filter(e => !existing.has(e)).forEach(e => sel.add(new Option(e, e)));
                $(sel).trigger('change.select2');
              } catch (e) {
                console.error('Failed to load entities:', e);
                const ctn = getEl('EntitiesSelectContainer');
                ctn.innerHTML = `
                  <div class="alert alert-danger" role="alert">
                    Failed to load entities.
                  </div>`;
              }
            }

            // Optional: reuse this if you need a direct helper elsewhere
            async function fetchBio(name) {
              try {
                const res = await fetchJSON('/person/bio', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({ person_name: name })
                });
                return res.bio;
              } catch (e) {
                console.error(`Error fetching bio for ${name}:`, e);
                return 'Bio not available.';
              }
            }

            async function showMatches(matches) {
              const out = getEl('MatchResults');

              if (!matches.length) {
                out.textContent = 'No relevant people found.';
                return;
              }

              out.innerHTML = '';

              for (const m of matches) {
                const bio = await fetchBio(m.name);

                const urlList = m.urls ? `
                  <ul>${m.urls.map(url => `<li><a href="${url}" target="_blank">${url}</a></li>`).join('')}</ul>
                ` : '';

                const matchEl = document.createElement('div');
                matchEl.className = 'alert alert-info py-1 mb-2';

                matchEl.innerHTML = `
                  <strong>${m.name}</strong> — score ${m.relevance_score}<br>
                  <em>${m.rationale}</em><br>
                  <small>${m.bio_quote}</small>
                  <div class="mt-2"><strong>Bio:</strong> ${bio}</div>
                  ${urlList}
                `;

                out.appendChild(matchEl);
              }
            }

            let matchProgressTimer = null;

            getEl('MatchPeopleBtn').addEventListener('click', async () => {
              const btn  = getEl('MatchPeopleBtn'),
                    txt  = getEl('MatchPeopleBtnText'),
                    spin = getEl('MatchPeopleBtnSpinner'),
                    box  = getEl('UserInterestText'),
                    input = (box.value || '').trim();

              if (!input) return;

              // Disable UI while running
              btn.disabled = true;
              box.disabled = true; // disable text input
              txt.textContent = 'Starting...';
              spin.classList.remove('d-none');

              try {
                // 1) start job
                const { job_id } = await fetchJSON('/people/search/start', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ query: input })
                });

                // 2) poll progress
                await new Promise((resolve, reject) => {
                  matchProgressTimer = setInterval(async () => {
                    try {
                      const { done, total, status, message } = await fetchJSON(`/people/search/progress?job_id=${encodeURIComponent(job_id)}`);
                      if (total > 0) {
                        txt.textContent = `Matching... (${done} of ${total} chunks done) -- Do not navigate away from the page`;
                      } else {
                        txt.textContent = 'Matching...';
                      }
                      if (status === 'error') {
                        clearInterval(matchProgressTimer);
                        matchProgressTimer = null;
                        reject(new Error(message || 'Search failed'));
                      }
                      if (status === 'done') {
                        clearInterval(matchProgressTimer);
                        matchProgressTimer = null;
                        resolve();
                      }
                    } catch (e) {
                      clearInterval(matchProgressTimer);
                      matchProgressTimer = null;
                      reject(e);
                    }
                  }, 1000);
                });

                // 3) fetch result
                const result = await fetchJSON(`/people/search/result?job_id=${encodeURIComponent(job_id)}`);
                renderMatches(result);

              } catch (e) {
                console.error('Matching error:', e);
                renderMatches({ query: input, matches: [], notes: 'Error fetching matches.' });
              } finally {
                // Re-enable UI
                btn.disabled = false;
                box.disabled = false;
                txt.textContent = 'Find Matches';
                spin.classList.add('d-none');
              }
            });

            const bioCache = new Map(); // name -> {name, bio}

            function attachBioHover(nameEl, personName) {
              if (!personName || personName === 'Unknown') return;

              let tooltip = null;
              let hideTimer = null;

              const showTooltip = async () => {
                // create tooltip if needed
                if (!tooltip) {
                  tooltip = document.createElement('div');
                  tooltip.className = 'custom-bio-tooltip alert alert-info shadow p-3';
                  tooltip.style.position = 'absolute';
                  tooltip.style.zIndex = 9999;
                  tooltip.style.width = '600px';
                  tooltip.style.maxWidth = '95vw';
                  tooltip.style.maxHeight = '60vh';
                  tooltip.style.overflow = 'auto';
                  tooltip.style.pointerEvents = 'auto'; // allow hover inside tooltip
                  tooltip.innerHTML = '<em>Loading bio...</em>';
                  document.body.appendChild(tooltip);

                  // Allow staying open when hovering tooltip
                  tooltip.addEventListener('mouseenter', () => {
                    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
                  });
                  tooltip.addEventListener('mouseleave', () => {
                    scheduleHide();
                  });
                }

                // position near name
                const rect = nameEl.getBoundingClientRect();
                tooltip.style.top = `${rect.bottom + window.scrollY + 6}px`;
                tooltip.style.left = `${rect.left + window.scrollX}px`;

                // populate content (from cache or fetch)
                try {
                  let data = bioCache.get(personName);
                  if (!data) {
                    data = await fetchJSON('/person/bio', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ person_name: personName })
                    });
                    bioCache.set(personName, data);
                  }

                  const { name, bio } = data || {};
                  tooltip.innerHTML = '';

                  const title = document.createElement('h5');
                  title.className = 'fw-bold mb-2';
                  title.textContent = name || personName;
                  tooltip.appendChild(title);

                  const bioEl = document.createElement('div');
                  bioEl.className = 'mb-0';

                  const parts = String(bio || '').split(/\n{2,}|\r?\n/).filter(Boolean);
                  if (parts.length === 0) {
                    const p = document.createElement('p');
                    p.className = 'mb-0';
                    p.textContent = 'Bio not available.';
                    bioEl.appendChild(p);
                  } else {
                    parts.forEach(txt => {
                      const p = document.createElement('p');
                      p.className = 'mb-2';
                      p.textContent = txt.trim();
                      bioEl.appendChild(p);
                    });
                  }
                  tooltip.appendChild(bioEl);
                } catch (err) {
                  console.error('Tooltip bio fetch error:', err);
                  tooltip.innerHTML = '<span class="text-danger">Error loading bio.</span>';
                }
              };

              const scheduleHide = () => {
                if (hideTimer) clearTimeout(hideTimer);
                hideTimer = setTimeout(() => {
                  if (tooltip) {
                    tooltip.remove();
                    tooltip = null;
                  }
                }, 200); // small delay so user can move from name to tooltip
              };

              // Hover behavior on the NAME (not the number prefix)
              nameEl.addEventListener('mouseenter', async () => {
                nameEl.style.textDecoration = 'underline';
                nameEl.style.color = '#0d6efd';
                if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
                await showTooltip();
              });

              nameEl.addEventListener('mouseleave', () => {
                nameEl.style.textDecoration = '';
                nameEl.style.color = '';
                scheduleHide();
              });
            }


            function renderMatches(payload) {
              const target = getEl('MatchResults');
              target.innerHTML = '';

              if (!payload || !Array.isArray(payload.matches) || payload.matches.length === 0) {
                target.innerHTML = `
                  <div class="alert alert-warning" role="alert">
                    No matches found for this query.
                  </div>
                `;
                if (payload?.notes) {
                  const notes = document.createElement('div');
                  notes.className = 'text-muted small mt-1';
                  notes.textContent = payload.notes;
                  target.appendChild(notes);
                }
                return;
              }

              // Optional header showing the query
              const hdr = document.createElement('div');
              hdr.className = 'mb-3';
              hdr.innerHTML = `
                <div class="fw-semibold">Query</div>
                <div class="text-muted">${escapeHtml(payload.query || '')}</div>
              `;
              target.appendChild(hdr);

              // Results list
              const list = document.createElement('div');
              list.className = 'd-flex flex-column gap-3';
              target.appendChild(list);

              payload.matches.forEach((m, idx) => {
                const card = document.createElement('div');
                card.className = 'card shadow-sm';

                const body = document.createElement('div');
                body.className = 'card-body';

                // Title row: index + name + badges
                const title = document.createElement('div');
                title.className = 'd-flex align-items-start justify-content-between flex-wrap gap-2';

                // inside renderMatches loop
                const nameEl = document.createElement('h5');
                nameEl.className = 'card-title mb-0 fw-bold person-name';
                nameEl.style.cursor = 'pointer';

                // Number span (muted)
                const numSpan = document.createElement('span');
                numSpan.className = 'text-muted me-2';
                numSpan.textContent = `${idx + 1}.`;

                // Name span (display only)
                const textSpan = document.createElement('span');
                textSpan.textContent = m.name || 'Unknown';

                nameEl.appendChild(numSpan);
                nameEl.appendChild(textSpan);

                title.appendChild(nameEl);

                // Attach hover with the raw name (no number)
                attachBioHover(textSpan, m.name || 'Unknown');

                const badges = document.createElement('div');
                badges.className = 'd-flex gap-2';

                const relBadge = document.createElement('span');
                relBadge.className = `badge ${relationBadgeClass(m.relation)}`;
                relBadge.textContent = (m.relation || 'adjacent').toLowerCase();
                badges.appendChild(relBadge);

                const confBadge = document.createElement('span');
                confBadge.className = `badge ${confidenceBadgeClass(m.confidence)}`;
                confBadge.textContent = (m.confidence || 'medium').toLowerCase();
                badges.appendChild(confBadge);

                title.appendChild(badges);
                body.appendChild(title);

                // Why
                if (m.why) {
                  const why = document.createElement('p');
                  why.className = 'mt-2 mb-2';
                  why.textContent = m.why;
                  body.appendChild(why);
                }

                // Snippet
                if (m.snippet) {
                  const sn = document.createElement('blockquote');
                  sn.className = 'blockquote small mb-2';
                  sn.textContent = m.snippet;
                  body.appendChild(sn);
                }

                // Matched signals
                if (Array.isArray(m.matched_signals) && m.matched_signals.length) {
                  const sigWrap = document.createElement('div');
                  sigWrap.className = 'small text-muted';
                  const ul = document.createElement('ul');
                  ul.className = 'mb-0 ps-3';
                  m.matched_signals.forEach(s => {
                    if (!s) return;
                    const li = document.createElement('li');
                    li.textContent = s;
                    ul.appendChild(li);
                  });
                  sigWrap.appendChild(ul);
                  body.appendChild(sigWrap);
                }

                card.appendChild(body);
                list.appendChild(card);
              });

              // Notes (optional)
              if (payload.notes) {
                const notes = document.createElement('div');
                notes.className = 'text-muted small mt-2';
                notes.textContent = payload.notes;
                target.appendChild(notes);
              }
            }

            // ---- Helpers ----

            function relationBadgeClass(rel) {
              const r = String(rel || '').toLowerCase();
              if (r === 'direct') return 'text-bg-primary';
              if (r === 'adjacent') return 'text-bg-secondary';
              if (r === 'emerging') return 'text-bg-warning';
              return 'text-bg-light';
            }

            function confidenceBadgeClass(c) {
              const v = String(c || '').toLowerCase();
              if (v === 'high') return 'text-bg-success';
              if (v === 'medium') return 'text-bg-info';
              if (v === 'low') return 'text-bg-light';
              return 'text-bg-light';
            }

            function escapeHtml(str) {
              return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
            }

            document.addEventListener('DOMContentLoaded',()=>{
              loadDbInfo();
              loadEntities();
            });
            </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
